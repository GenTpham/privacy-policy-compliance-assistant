services:
  # Optional — only for one-time local ingestion (QDRANT_URL=http://localhost:6333)
  qdrant:
    profiles: [local-qdrant]
    image: qdrant/qdrant:v1.17.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-10.7.1
    profiles: [observability]
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6006 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/data:/app/backend/data

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

volumes:
  qdrant_storage:
